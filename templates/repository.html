
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository - St. Jerome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #1a0f0d; color: white; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative" x-data="repoSearch()">
    
    <!-- Global Background -->
    <div class="fixed inset-0 z-[-1]">
        <img src="/static/img/bg4.jpg" class="w-full h-full object-cover opacity-10 mix-blend-screen grayscale">
        <div class="absolute inset-0 bg-gradient-to-b from-[#1a0f0d]/60 to-[#1a0f0d] z-10"></div>
    </div>

    <!-- Navbar -->
    <nav class="px-6 md:px-12 py-5 flex justify-between items-center border-b border-white/10 z-50 bg-[#1a0f0d]/80 backdrop-blur-md sticky top-0">
        <a href="/opac" class="flex items-center gap-4 hover:opacity-80 transition-opacity">
            <img src="/static/img/logo_imavi.png" class="h-10 w-10 object-cover bg-white/95 rounded-full p-1 shadow-md">
            <div class="flex flex-col">
                <span class="font-serif font-bold text-xl leading-none tracking-wide">ST. JEROME</span>
                <span class="text-[10px] tracking-[0.3em] uppercase text-[#E6B325] mt-1">Repository</span>
            </div>
        </a>
        <div class="flex gap-4 items-center">
            <a href="/opac" class="text-sm font-medium text-white/60 hover:text-white transition-colors hidden md:block mr-4">Kembali ke OPAC Cetak</a>
            <a href="/opac/member/dashboard" class="text-xs md:text-sm font-bold text-[#E6B325] border border-[#E6B325] px-5 py-2 rounded-full hover:bg-[#E6B325] hover:text-[#1a0f0d] transition-all shadow-[0_0_15px_rgba(230,179,37,0.2)]">
                Member Portal
            </a>
        </div>
    </nav>

    <!-- Hero Search -->
    <main class="flex-1 w-full max-w-5xl mx-auto px-6 py-20 flex flex-col items-center">
        <span class="text-[#E6B325] text-[10px] md:text-xs font-bold uppercase tracking-[0.3em] mb-4 text-center">Pusat Pengetahuan Digital</span>
        <h1 class="text-5xl md:text-6xl font-serif font-bold text-center mb-6 leading-tight">Institutional Repository</h1>
        <p class="text-white/50 text-center max-w-2xl mb-12">Jelajahi koleksi digital eksklusif yang mencakup Tesis, Skripsi, dan Jurnal penelitian dari sivitas akademika St. Jerome.</p>

        <!-- Search Bar -->
        <div class="w-full max-w-3xl relative mb-16 group">
            <input type="text" x-model="query" @input.debounce.300ms="search()" placeholder="Ketik judul skripsi, nama penulis, atau subjek..." class="w-full bg-white/5 border border-white/10 rounded-full px-8 py-5 pl-16 text-white text-lg placeholder-white/30 focus:outline-none focus:border-[#E6B325] focus:bg-white/10 transition-all backdrop-blur-sm shadow-xl">
            <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 transform -translate-y-1/2 text-white/40 text-xl group-focus-within:text-[#E6B325] transition-colors"></i>
        </div>

        <!-- Results List -->
        <div class="w-full max-w-3xl flex flex-col gap-6 pb-20">
            <template x-for="item in results" :key="item.id">
                <div class="bg-white/5 border border-white/5 p-6 md:p-8 rounded-[2rem] hover:bg-white/10 hover:border-[#E6B325]/30 transition-all group backdrop-blur-sm shadow-lg hover:shadow-2xl">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-3">
                                <span class="bg-[#E6B325]/20 text-[#E6B325] text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full" x-text="item.gmd || 'Karya Ilmiah'"></span>
                                <span class="text-white/30 text-xs font-bold" x-text="'ID: ' + item.id"></span>
                            </div>
                            <h3 class="text-2xl font-serif font-bold text-white mb-2 group-hover:text-[#E6B325] transition-colors leading-tight" x-text="item.judul"></h3>
                            <p class="text-white/60 text-sm font-medium" x-text="'Oleh: ' + (item.pengarang || 'Tidak diketahui') + ' • ' + (item.tahun_terbit || '-')"></p>
                        </div>
                        <a :href="'/opac/member/reader?id=' + item.id" class="shrink-0 bg-[#E6B325] text-[#1a0f0d] flex items-center gap-3 px-6 py-3 rounded-full hover:scale-105 transition-transform shadow-[0_0_20px_rgba(230,179,37,0.3)] font-bold text-sm uppercase tracking-wider w-full md:w-auto justify-center">
                            Baca <i class="fa-solid fa-book-open"></i>
                        </a>
                    </div>
                </div>
            </template>
            
            <div x-show="results.length === 0" class="text-center text-white/30 py-10 bg-white/5 rounded-[2rem] border border-white/5 border-dashed">
                <i class="fa-solid fa-folder-open text-4xl mb-4 opacity-30"></i>
                <p>Tidak ada dokumen yang ditemukan.</p>
            </div>
        </div>
    </main>

    <script>
        function repoSearch() {
            return {
                query: '',
                results: [],
                init() { this.search(); },
                async search() {
                    try {
                        const response = await fetch('/api/repository/search?q=' + encodeURIComponent(this.query));
                        const data = await response.json();
                        this.results = data;
                    } catch (e) {
                        console.error(e);
                    }
                }
            }
        }
    </script>
</body>
</html>
