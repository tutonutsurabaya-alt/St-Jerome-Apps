<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - St. Jerome Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #1a1a1a; color: #FDFBF7; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative items-center justify-center">
    <div class="fixed inset-0 z-[-1]">
        <div class="absolute inset-0 bg-gradient-to-br from-[#1a1a1a] to-[#2a0800] opacity-95 z-10"></div>
    </div>

    <div class="w-full max-w-md bg-black/40 backdrop-blur-xl p-10 rounded-2xl border border-red-900/30 shadow-2xl relative z-20">
        <div class="flex flex-col items-center mb-8">
            <i class="fa-solid fa-user-shield text-5xl text-red-700 mb-4"></i>
            <h1 class="text-3xl font-serif font-bold text-white text-center">Portal Pustakawan</h1>
            <p class="text-white/50 text-sm mt-2">Masuk ke ruang kontrol St. Jerome</p>
        </div>

        {% if error %}
        <div class="bg-red-900/50 border border-red-500 text-red-200 px-4 py-3 rounded-lg mb-6 text-sm text-center">
            <i class="fa-solid fa-triangle-exclamation mr-2"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/opac/admin/login" class="flex flex-col gap-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-white/50 mb-2">Username Master</label>
                <input type="text" name="username" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-red-500 transition-colors">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-white/50 mb-2">Kata Sandi</label>
                <input type="password" name="password" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-red-500 transition-colors">
            </div>
            <button type="submit" class="mt-4 bg-red-700 hover:bg-red-600 text-white font-bold py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-key"></i> Buka Akses
            </button>
        </form>
    </div>
</body>
</html>
